name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest --stacktrace

  build-and-audit:
    name: build-and-manifest-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: chmod +x gradlew scripts/audit_manifest.sh
      - run: ./gradlew :app:assembleDebug --stacktrace
      - run: bash scripts/audit_manifest.sh

  release:
    name: publish-github-release
    needs: [test, build-and-audit]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Extract version metadata
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Require release signing secrets
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.KHIDKI_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KHIDKI_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KHIDKI_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KHIDKI_RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_B64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "ERROR: Missing required GitHub secret for ${name}" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Tag releases must be owner-signed. Set all KHIDKI_RELEASE_* secrets before pushing v* tags." >&2
            exit 1
          fi

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.KHIDKI_RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/release-keystore
          echo "$RELEASE_KEYSTORE_B64" | base64 --decode > app/release-keystore/release.keystore

      - run: chmod +x gradlew scripts/audit_manifest.sh scripts/prepare_release_apk.sh scripts/generate_release_notes.sh

      - name: Build release APK
        env:
          KHIDKI_RELEASE_STORE_PASSWORD: ${{ secrets.KHIDKI_RELEASE_STORE_PASSWORD }}
          KHIDKI_RELEASE_KEY_ALIAS: ${{ secrets.KHIDKI_RELEASE_KEY_ALIAS }}
          KHIDKI_RELEASE_KEY_PASSWORD: ${{ secrets.KHIDKI_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - run: bash scripts/audit_manifest.sh

      - name: Package release artifacts
        id: package
        env:
          KHIDKI_VERSION_NAME: ${{ steps.version.outputs.name }}
          KHIDKI_VERSION_CODE: ${{ steps.version.outputs.code }}
          KHIDKI_RELEASE_CHANNEL: versioned
          KHIDKI_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash scripts/prepare_release_apk.sh
          echo "apk_basename=$(jq -r .apkFile release-artifacts/release-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          KHIDKI_VERSION_NAME: ${{ steps.version.outputs.name }}
          KHIDKI_VERSION_CODE: ${{ steps.version.outputs.code }}
          KHIDKI_RELEASE_TAG: ${{ github.ref_name }}
          APK_BASENAME: ${{ steps.package.outputs.apk_basename }}
        run: bash scripts/generate_release_notes.sh > release-artifacts/RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Khidki ${{ github.ref_name }}
          body_path: release-artifacts/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, 'preview') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          make_latest: true
          files: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
            release-artifacts/release-metadata.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
