name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest --stacktrace

  build-and-audit:
    name: build-and-manifest-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: chmod +x gradlew scripts/audit_manifest.sh
      - run: ./gradlew :app:assembleDebug --stacktrace
      - run: bash scripts/audit_manifest.sh

  release:
    name: publish-github-release
    needs: [test, build-and-audit]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Extract version metadata
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Compute release tag
        id: release_tag
        run: |
          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "channel=versioned" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ steps.version.outputs.name }}-b${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "channel=ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode preview keystore override if present
        env:
          KEYSTORE_B64: ${{ secrets.KHIDKI_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p app/debug-keystore
            echo "$KEYSTORE_B64" | base64 --decode > app/debug-keystore/debug.keystore
          fi

      - name: Decode release keystore if present
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.KHIDKI_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KHIDKI_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KHIDKI_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KHIDKI_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            mkdir -p app/release-keystore
            echo "$RELEASE_KEYSTORE_B64" | base64 --decode > app/release-keystore/release.keystore
          fi

      - run: chmod +x gradlew scripts/audit_manifest.sh scripts/prepare_release_apk.sh scripts/generate_release_notes.sh

      - name: Build release APK
        env:
          KHIDKI_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - run: bash scripts/audit_manifest.sh

      - name: Package release artifacts
        id: package
        env:
          KHIDKI_VERSION_NAME: ${{ steps.version.outputs.name }}
          KHIDKI_VERSION_CODE: ${{ steps.version.outputs.code }}
          KHIDKI_RELEASE_CHANNEL: ${{ steps.release_tag.outputs.channel }}
          KHIDKI_RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          bash scripts/prepare_release_apk.sh
          echo "apk_basename=$(jq -r .apkFile release-artifacts/release-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          KHIDKI_VERSION_NAME: ${{ steps.version.outputs.name }}
          KHIDKI_VERSION_CODE: ${{ steps.version.outputs.code }}
          KHIDKI_RELEASE_CHANNEL: ${{ steps.release_tag.outputs.channel }}
          KHIDKI_RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          APK_BASENAME: ${{ steps.package.outputs.apk_basename }}
        run: bash scripts/generate_release_notes.sh > release-artifacts/RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Khidki ${{ steps.release_tag.outputs.tag }}
          body_path: release-artifacts/RELEASE_NOTES.md
          prerelease: ${{ steps.release_tag.outputs.channel == 'ci' || contains(steps.release_tag.outputs.tag, 'preview') || contains(steps.release_tag.outputs.tag, 'beta') || contains(steps.release_tag.outputs.tag, 'alpha') }}
          make_latest: true
          files: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
            release-artifacts/release-metadata.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
