name: preview-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Decode preview keystore if present
        env:
          KEYSTORE_B64: ${{ secrets.KHIDKI_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            echo "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            echo "No preview keystore secret; using ephemeral debug keystore."
          fi
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: Khidki preview
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
