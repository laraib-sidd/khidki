name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve checkout ref
        id: checkout_ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.checkout_ref.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Extract version metadata
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Compute release tag
        id: release_tag
        run: |
          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "channel=versioned" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build/b${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "channel=build" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode preview keystore override if present
        env:
          KEYSTORE_B64: ${{ secrets.KHIDKI_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p app/debug-keystore
            echo "$KEYSTORE_B64" | base64 --decode > app/debug-keystore/debug.keystore
            echo "Using KHIDKI_PREVIEW_KEYSTORE_BASE64 override."
          else
            echo "Using committed deterministic debug keystore."
          fi

      - run: chmod +x gradlew scripts/audit_manifest.sh scripts/prepare_release_apk.sh scripts/generate_release_notes.sh

      - name: Build and test
        env:
          KHIDKI_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - run: bash scripts/audit_manifest.sh

      - name: Package release artifacts
        id: package
        env:
          KHIDKI_VERSION_NAME: ${{ steps.version.outputs.name }}
          KHIDKI_VERSION_CODE: ${{ steps.version.outputs.code }}
          KHIDKI_RELEASE_CHANNEL: ${{ steps.release_tag.outputs.channel }}
          KHIDKI_RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          bash scripts/prepare_release_apk.sh
          echo "apk_basename=$(jq -r .apkFile release-artifacts/release-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        env:
          KHIDKI_VERSION_NAME: ${{ steps.version.outputs.name }}
          KHIDKI_VERSION_CODE: ${{ steps.version.outputs.code }}
          KHIDKI_RELEASE_CHANNEL: ${{ steps.release_tag.outputs.channel }}
          KHIDKI_RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          APK_BASENAME: ${{ steps.package.outputs.apk_basename }}
        run: |
          NOTES_FILE=release-artifacts/RELEASE_NOTES.md
          bash scripts/generate_release_notes.sh > "$NOTES_FILE"
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Prune legacy generic APK assets
        if: steps.release_tag.outputs.channel == 'build'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset preview app-debug.apk -R "${{ github.repository }}" -y || true

      - name: Publish immutable build release
        if: steps.release_tag.outputs.channel == 'build'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Khidki ${{ steps.version.outputs.name }}-debug (${{ steps.release_tag.outputs.tag }})
          body_path: release-artifacts/RELEASE_NOTES.md
          prerelease: true
          make_latest: true
          files: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
            release-artifacts/release-metadata.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh rolling preview pointer
        if: steps.release_tag.outputs.channel == 'build'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          target_commitish: ${{ steps.checkout_ref.outputs.ref }}
          name: Khidki preview (rolling → ${{ steps.release_tag.outputs.tag }})
          body_path: release-artifacts/RELEASE_NOTES.md
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
            release-artifacts/release-metadata.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned release
        if: steps.release_tag.outputs.channel == 'versioned'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Khidki ${{ steps.release_tag.outputs.tag }}
          body_path: release-artifacts/RELEASE_NOTES.md
          prerelease: ${{ contains(steps.release_tag.outputs.tag, 'preview') || contains(steps.release_tag.outputs.tag, 'beta') || contains(steps.release_tag.outputs.tag, 'alpha') }}
          make_latest: ${{ !contains(steps.release_tag.outputs.tag, 'preview') && !contains(steps.release_tag.outputs.tag, 'beta') && !contains(steps.release_tag.outputs.tag, 'alpha') }}
          overwrite_files: true
          files: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
            release-artifacts/release-metadata.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
