name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Decode preview keystore override if present
        env:
          KEYSTORE_B64: ${{ secrets.KHIDKI_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p app/debug-keystore
            echo "$KEYSTORE_B64" | base64 --decode > app/debug-keystore/debug.keystore
            echo "Using KHIDKI_PREVIEW_KEYSTORE_BASE64 override."
          else
            echo "Using committed deterministic debug keystore."
          fi
      - run: chmod +x gradlew scripts/audit_manifest.sh
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - run: bash scripts/audit_manifest.sh
      - name: Publish preview APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: Khidki preview
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Khidki ${{ github.ref_name }}
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
